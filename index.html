<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopMind AI — Agentic RAG Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --glass-bg:rgba(255,255,255,0.08);
  --glass-border:rgba(255,255,255,0.15);
  --glass-shadow:0 8px 32px rgba(0,0,0,0.3);
  --blur:backdrop-filter:blur(20px);
  --accent:#7c6aff;
  --accent2:#ff6ab0;
  --text:#fff;
  --text-dim:rgba(255,255,255,0.65);
}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#0f0c29 0%,#1a1a2e 50%,#0f0c29 100%);
  color:var(--text);
  overflow-x:hidden;
}
/* Animated blobs */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.25;pointer-events:none;z-index:0;}
.blob1{width:500px;height:500px;background:radial-gradient(circle,#7c6aff,#302b63);top:-100px;left:-100px;animation:float1 8s ease-in-out infinite;}
.blob2{width:400px;height:400px;background:radial-gradient(circle,#ff6ab0,#302b63);bottom:-80px;right:-80px;animation:float2 10s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.1)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.15)}}

/* Layout */
.app{position:relative;z-index:1;display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;min-height:100vh;}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;background:var(--glass-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);}
.logo{display:flex;align-items:center;gap:.7rem;font-size:1.3rem;font-weight:700;}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.status-pill{background:rgba(67,232,216,.15);border:1px solid rgba(67,232,216,.3);color:#43e8d8;padding:.3rem .9rem;border-radius:999px;font-size:.78rem;font-weight:500;display:flex;align-items:center;gap:.4rem;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#43e8d8;}

/* Sidebar */
.sidebar{background:var(--glass-bg);backdrop-filter:blur(20px);border-right:1px solid var(--glass-border);padding:1.5rem;display:flex;flex-direction:column;gap:1.2rem;overflow-y:auto;}
.panel-title{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:.3rem;}

/* Filter glass card */
.glass-card{background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:16px;padding:1.1rem;backdrop-filter:blur(10px);}
.filter-group{display:flex;flex-direction:column;gap:.6rem;}
label{font-size:.82rem;color:var(--text-dim);}
select, input{
  width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;padding:.55rem .85rem;color:#fff;font-size:.85rem;font-family:'Inter',sans-serif;outline:none;
}

/* Main chat area */
.main{display:flex;flex-direction:column;overflow:hidden;}
.chat-window{flex:1;overflow-y:auto;padding:1.5rem 2rem;display:flex;flex-direction:column;gap:1.2rem;}

/* Messages */
.msg{display:flex;gap:.8rem;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse;}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.avatar.ai{background:linear-gradient(135deg,var(--accent),var(--accent2));}
.avatar.user{background:rgba(255,255,255,0.15);border:1px solid var(--glass-border);}
.bubble{max-width:72%;padding:1rem 1.2rem;border-radius:18px;line-height:1.6;font-size:.9rem;}
.bubble.ai{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-top-left-radius:4px;}
.bubble.user{background:linear-gradient(135deg,var(--accent),#5a50e0);border-top-right-radius:4px;}

/* Product cards grid */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;margin-top:1rem;}
.product-card{
  background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);
  border-radius:14px;overflow:hidden;transition:all .25s;
}
.product-card:hover{transform:translateY(-4px);border-color:var(--accent);}
.product-card img{width:100%;height:120px;object-fit:cover;}
.product-info{padding:.8rem;}
.product-name{font-size:.8rem;font-weight:600;margin-bottom:.3rem;}
.product-price{font-size:.95rem;font-weight:700;color:#43e8d8;}

/* Input bar */
.input-bar{padding:1.5rem 2rem;background:rgba(15,12,41,0.6);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);}
.input-row{display:flex;gap:.7rem;max-width:900px;margin:0 auto;}
.input-wrap{flex:1;background:rgba(255,255,255,0.08);border:1px solid var(--glass-border);border-radius:18px;display:flex;align-items:center;padding:.6rem 1rem;}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:.95rem;font-family:'Inter',sans-serif;resize:none;max-height:120px;}
.btn-send{width:48px;height:48px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:0.2s;}
.btn-send:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(124,106,255,0.4);}

/* Welcome */
.welcome{text-align:center;padding:4rem 1rem;opacity:.8;}
.welcome h2{font-size:2.2rem;margin-bottom:.8rem;background:linear-gradient(135deg,#fff,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* Typing */
.typing{display:flex;gap:5px;padding:.5rem 0;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5);animation:bounce .9s infinite;}
.dot:nth-child(2){animation-delay:.15s;}
.dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Upload zone */
.upload-zone{border:2px dashed var(--glass-border);border-radius:16px;padding:1.5rem;text-align:center;cursor:pointer;transition:0.3s;}
.upload-zone:hover{border-color:var(--accent);background:rgba(124,106,255,0.05);}
.upload-preview{width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-top:1rem;display:none;}

@media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{display:none}}
</style>
  <script type="module" crossorigin src="/ecommerce-rag/assets/index-RK3_tDBZ.js"></script>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🛍️</div>
      <span>ShopMind <span style="color:var(--accent)">AI</span></span>
    </div>
    <div class="status-pill"><div class="status-dot"></div><span>Serverless RAG Mode</span></div>
  </header>

  <aside class="sidebar">
    <div>
      <div class="panel-title">🔍 Filters</div>
      <div class="glass-card filter-group">
        <label>Category</label>
        <select id="filterCategory">
          <option value="">All Categories</option>
          <option>Electronics</option>
          <option>Apparel</option>
          <option>Footwear</option>
          <option>Kitchen</option>
          <option>Home</option>
          <option>Smart Home</option>
          <option>Wearables</option>
        </select>
        <label style="margin-top:.5rem">Brand</label>
        <input type="text" id="filterBrand" placeholder="e.g. Sony, Apple...">
      </div>
    </div>

    <div>
      <div class="panel-title">🖼️ Visual Search</div>
      <div class="upload-zone" onclick="document.getElementById('imgInput').click()">
        <input type="file" id="imgInput" accept="image/*" hidden onchange="handleImageSelect(event)">
        <div style="font-size:2rem">📷</div>
        <div style="font-size:.8rem;color:var(--text-dim);margin-top:.5rem">Upload product photo</div>
        <img id="uploadPreview" class="upload-preview">
      </div>
    </div>

    <div style="margin-top:auto">
      <div class="panel-title">Powered By</div>
      <div class="glass-card" style="font-size:.75rem;color:var(--text-dim)">
        Gemini 1.5 Flash<br>
        Direct Client-Side RAG<br>
        Zero Backend Infrastructure
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="chat-window" id="chatWindow">
      <div class="welcome" id="welcome">
        <h2>Your AI Personal Shopper</h2>
        <p>I can help you find products, compare specs, and give recommendations from our inventory.</p>
        <div style="display:flex;gap:.8rem;justify-content:center;margin-top:2rem;flex-wrap:wrap">
          <button class="glass-card" style="cursor:pointer;padding:.6rem 1.2rem;font-size:.85rem" onclick="setQuery('Best noise cancelling headphones')">🎧 Best ANC Headphones</button>
          <button class="glass-card" style="cursor:pointer;padding:.6rem 1.2rem;font-size:.85rem" onclick="setQuery('Suggest some eco-friendly jackets')">🌱 Eco-friendly Jackets</button>
          <button class="glass-card" style="cursor:pointer;padding:.6rem 1.2rem;font-size:.85rem" onclick="setQuery('Show me kitchen appliances')">🍳 Kitchen Essentials</button>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-row">
        <div class="input-wrap">
          <textarea id="queryInput" rows="1" placeholder="Search or ask anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendQuery()}"></textarea>
        </div>
        <button class="btn-send" onclick="sendQuery()">➤</button>
      </div>
    </div>
  </main>
</div>

</body>
</html>
